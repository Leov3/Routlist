services:
  postgres:
    image: postgres:17-alpine
    container_name: routlis-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routlis}
      POSTGRES_USER: ${POSTGRES_USER:-routlis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - routlis-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routlis} -d ${POSTGRES_DB:-routlis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: routlis-backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-routlis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-routlis}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY}
      COOKIE_NAME: ${COOKIE_NAME:-routlis_token}
      COOKIE_SECURE: "true"
      FRONTEND_URL: https://${FRONTEND_HOST}
      CORS_ORIGINS: https://${FRONTEND_HOST}
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /app/storage
      LOCAL_AUDIO_PATH: /app/storage/audio-assets
      LOCAL_BACKUP_PATH: /app/storage/backups
      PUBLIC_AUDIO_BASE_URL: https://${API_HOST}/files/audio-assets
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    volumes:
      - routlis_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - routlis-private
      - routlis-public
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${API_HOST}
        NEXT_PUBLIC_MEDIA_URL: https://${API_HOST}
    container_name: routlis-frontend
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - routlis-public

volumes:
  postgres_data:
    name: routlis_postgres_data
  routlis_storage:
    name: routlis_storage

networks:
  routlis-public:
    name: routlis_public
  routlis-private:
    name: routlis_private
