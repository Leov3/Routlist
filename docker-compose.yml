services:
  postgres:
    image: postgres:17-alpine
    container_name: routlis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: routlis
      POSTGRES_USER: routlis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routlis}
    volumes:
      - routlis_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: routlis-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://routlis:${POSTGRES_PASSWORD:-routlis}@postgres:5432/routlis?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      COOKIE_NAME: ${COOKIE_NAME:-routlis_token}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/var/www/routlis/storage}
      LOCAL_AUDIO_PATH: ${LOCAL_AUDIO_PATH:-/var/www/routlis/storage/audio-assets}
      PUBLIC_AUDIO_BASE_URL: ${PUBLIC_AUDIO_BASE_URL:-http://localhost:4000/files/audio-assets}
      FRONTEND_URL: http://localhost:3001
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
      PORT: ${PORT:-4000}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123*}
    depends_on:
      - postgres
    ports:
      - "4000:4000"
    volumes:
      - routlis_storage:/var/www/routlis/storage

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL:-http://localhost:4000}
    container_name: routlis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:3000"

volumes:
  routlis_postgres_data:
  routlis_storage:
