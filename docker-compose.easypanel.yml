services:
  postgres:
    image: postgres:17-alpine
    container_name: routlis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routlis}
      POSTGRES_USER: ${POSTGRES_USER:-routlis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - routlis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routlis} -d ${POSTGRES_DB:-routlis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: routlis-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-routlis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-routlis}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      COOKIE_NAME: ${COOKIE_NAME:-routlis_token}
      COOKIE_SECURE: "true"
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /var/www/routlis/storage
      LOCAL_AUDIO_PATH: /var/www/routlis/storage/audio-assets
      PUBLIC_AUDIO_BASE_URL: ${PUBLIC_AUDIO_BASE_URL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    volumes:
      - routlis_storage:/var/www/routlis/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
    container_name: routlis-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production

volumes:
  routlis_postgres_data:
    name: routlis_postgres_data
  routlis_storage:
    name: routlis_storage
