name: Deploy to VPS

on:
  push:
    branches:
      - principal
  workflow_dispatch:
    inputs:
      run_seed:
        description: Run prisma seed after deploy
        required: false
        type: boolean
        default: false

concurrency:
  group: routlis-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_ENV_FILE: /opt/routlis/.env

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Prepare SSH config
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/config <<'EOF'
Host *
  StrictHostKeyChecking accept-new
  UserKnownHostsFile ~/.ssh/known_hosts
  ServerAliveInterval 30
  ServerAliveCountMax 2
EOF
          chmod 600 ~/.ssh/config

      - name: Sync project files to VPS
        run: |
          tar -czf /tmp/routlis.tar.gz --exclude=.git --exclude=node_modules --exclude=.next --exclude=dist .
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          port="${port:-22}"
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          scp -P "$port" /tmp/routlis.tar.gz "${{ secrets.VPS_USER }}@$host:/tmp/routlis.tar.gz"
          ssh -p "$port" "${{ secrets.VPS_USER }}@$host" "mkdir -p '${{ secrets.VPS_APP_DIR }}' && find '${{ secrets.VPS_APP_DIR }}' -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} + && tar -xzf /tmp/routlis.tar.gz -C '${{ secrets.VPS_APP_DIR }}' && rm /tmp/routlis.tar.gz"

      - name: Ensure VPS env file exists
        run: |
          printf '%s' '${{ secrets.VPS_ENV_CONTENT_B64 }}' | base64 -d > /tmp/routlis.env
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          port="${port:-22}"
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          scp -P "$port" /tmp/routlis.env "${{ secrets.VPS_USER }}@$host:${{ env.VPS_ENV_FILE }}"
          ssh -p "$port" "${{ secrets.VPS_USER }}@$host" "chmod 600 '${{ env.VPS_ENV_FILE }}' && chown '${{ secrets.VPS_USER }}':'${{ secrets.VPS_USER }}' '${{ env.VPS_ENV_FILE }}'"
          rm -f /tmp/routlis.env

      - name: Preflight on VPS
        run: |
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          port="${port:-22}"
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          ssh -p "$port" "${{ secrets.VPS_USER }}@$host" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh preflight"

      - name: Deploy app on VPS
        run: |
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          port="${port:-22}"
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          ssh -p "$port" "${{ secrets.VPS_USER }}@$host" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh deploy"

      - name: Verify deploy on VPS
        run: |
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          port="${port:-22}"
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          ssh -p "$port" "${{ secrets.VPS_USER }}@$host" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh verify"

      - name: Bootstrap seed on demand
        if: github.event_name == 'workflow_dispatch' && inputs.run_seed == true
        run: |
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          ssh -p "$port" "${{ secrets.VPS_USER }}@$host" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh seed"
