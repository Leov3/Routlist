name: Deploy to VPS

on:
  push:
    branches:
      - principal
  workflow_dispatch:
    inputs:
      run_seed:
        description: Run prisma seed after deploy
        required: false
        type: boolean
        default: false

concurrency:
  group: routlis-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_ENV_FILE: /opt/routlis/.env
      VPS_CONNECT_TIMEOUT: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Resolve SSH target
        run: |
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          if [[ -z "$port" ]]; then
            port=22
          fi
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          if [[ -z "$host" ]]; then
            echo "VPS_HOST is empty" >&2
            exit 1
          fi
          if [[ -z "${{ secrets.VPS_USER }}" ]]; then
            echo "VPS_USER is empty" >&2
            exit 1
          fi
          echo "VPS target: ${host}:${port}"
          if [[ "$host" =~ ([0-9]{1,3}\.){3}[0-9]{1,3} ]]; then
            echo "VPS target IP fallback: $(grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' <<< "$host" | head -n 1):${port}"
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Sync project files to VPS
        run: |
          try_ssh() {
            local port="$1"
            local target="$2"
            local user="$3"
            scp -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -P "$port" /tmp/routlis.tar.gz "${user}@$target:/tmp/routlis.tar.gz" &&
            ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${user}@$target" "mkdir -p '${{ secrets.VPS_APP_DIR }}' && find '${{ secrets.VPS_APP_DIR }}' -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} + && tar -xzf /tmp/routlis.tar.gz -C '${{ secrets.VPS_APP_DIR }}' && rm /tmp/routlis.tar.gz"
          }
          tar -czf /tmp/routlis.tar.gz --exclude=.git --exclude=node_modules --exclude=.next --exclude=dist .
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          port="${port:-22}"
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          fallback_ip="$(grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' <<< "$host" | head -n 1 || true)"
          users=("${{ secrets.VPS_USER }}" root)
          for user in "${users[@]}"; do
            if [[ -z "$user" ]]; then
              continue
            fi
            if try_ssh "$port" "$host" "$user"; then
              exit 0
            fi
            if [[ -n "$fallback_ip" && "$fallback_ip" != "$host" ]] && try_ssh "$port" "$fallback_ip" "$user"; then
              exit 0
            fi
          done
          echo "Failed to sync project files using configured users" >&2
          exit 1

      - name: Ensure VPS env file exists
        run: |
          try_copy_env() {
            local port="$1"
            local target="$2"
            local user="$3"
            scp -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -P "$port" /tmp/routlis.env "${user}@$target:${{ env.VPS_ENV_FILE }}" &&
            ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${user}@$target" "chmod 600 '${{ env.VPS_ENV_FILE }}' && chown '${user}':'${user}' '${{ env.VPS_ENV_FILE }}'"
          }
          printf '%s' '${{ secrets.VPS_ENV_CONTENT_B64 }}' | base64 -d > /tmp/routlis.env
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          port="${port:-22}"
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          fallback_ip="$(grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' <<< "$host" | head -n 1 || true)"
          users=("${{ secrets.VPS_USER }}" root)
          for user in "${users[@]}"; do
            if [[ -z "$user" ]]; then
              continue
            fi
            if try_copy_env "$port" "$host" "$user"; then
              exit 0
            fi
            if [[ -n "$fallback_ip" && "$fallback_ip" != "$host" ]] && try_copy_env "$port" "$fallback_ip" "$user"; then
              exit 0
            fi
          done
          echo "Failed to copy env using configured users" >&2
          exit 1
          rm -f /tmp/routlis.env

      - name: Preflight on VPS
        run: |
          run_remote() {
            local port="$1"
            local target="$2"
            local user="$3"
            local command="$4"
            ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${user}@$target" "$command"
          }
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          port="${port:-22}"
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          fallback_ip="$(grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' <<< "$host" | head -n 1 || true)"
          users=("${{ secrets.VPS_USER }}" root)
          for user in "${users[@]}"; do
            if [[ -z "$user" ]]; then
              continue
            fi
            if run_remote "$port" "$host" "$user" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh preflight"; then
              exit 0
            fi
            if [[ -n "$fallback_ip" && "$fallback_ip" != "$host" ]] && run_remote "$port" "$fallback_ip" "$user" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh preflight"; then
              exit 0
            fi
          done
          echo "Failed preflight using configured users" >&2
          exit 1

      - name: Deploy app on VPS
        run: |
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          port="${port:-22}"
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          fallback_ip="$(grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' <<< "$host" | head -n 1 || true)"
          users=("${{ secrets.VPS_USER }}" root)
          for user in "${users[@]}"; do
            if [[ -z "$user" ]]; then
              continue
            fi
            if ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${user}@$host" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh deploy"; then
              exit 0
            fi
            if [[ -n "$fallback_ip" && "$fallback_ip" != "$host" ]] && ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${user}@$fallback_ip" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh deploy"; then
              exit 0
            fi
          done
          echo "Failed to deploy using configured users" >&2
          exit 1

      - name: Verify deploy on VPS
        run: |
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          port="${port:-22}"
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          fallback_ip="$(grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' <<< "$host" | head -n 1 || true)"
          users=("${{ secrets.VPS_USER }}" root)
          for user in "${users[@]}"; do
            if [[ -z "$user" ]]; then
              continue
            fi
            if ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${user}@$host" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh verify"; then
              exit 0
            fi
            if [[ -n "$fallback_ip" && "$fallback_ip" != "$host" ]] && ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${user}@$fallback_ip" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh verify"; then
              exit 0
            fi
          done
          echo "Failed to verify deploy using configured users" >&2
          exit 1

      - name: Bootstrap seed on demand
        if: github.event_name == 'workflow_dispatch' && inputs.run_seed == true
        run: |
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          fallback_ip="$(grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' <<< "$host" | head -n 1 || true)"
          users=("${{ secrets.VPS_USER }}" root)
          for user in "${users[@]}"; do
            if [[ -z "$user" ]]; then
              continue
            fi
            if ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${user}@$host" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh seed"; then
              exit 0
            fi
            if [[ -n "$fallback_ip" && "$fallback_ip" != "$host" ]] && ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${user}@$fallback_ip" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh seed"; then
              exit 0
            fi
          done
          echo "Failed to seed using configured users" >&2
          exit 1
