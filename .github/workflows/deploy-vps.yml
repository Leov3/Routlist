name: Deploy to VPS

on:
  push:
    branches:
      - principal
  workflow_dispatch:
    inputs:
      run_seed:
        description: Run prisma seed after deploy
        required: false
        type: boolean
        default: false

concurrency:
  group: routlis-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, routlis-vps]
    env:
      VPS_ENV_FILE: /opt/routlis/.env

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy app on VPS
        run: |
          cd "${{ github.workspace }}"
          ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh deploy

      - name: Verify deploy on VPS
        run: |
          cd "${{ github.workspace }}"
          ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh verify

      - name: Bootstrap seed on demand
        if: github.event_name == 'workflow_dispatch' && inputs.run_seed == true
        run: |
          cd "${{ github.workspace }}"
          ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh seed
