name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_seed:
        description: Run prisma seed after deploy
        required: false
        type: boolean
        default: false

concurrency:
  group: routlis-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_COMPOSE_PROFILE: ${{ secrets.VPS_COMPOSE_PROFILE || 'prod' }}

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync and deploy app on VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "cd '${{ secrets.VPS_APP_DIR }}' && git fetch origin main && git reset --hard origin/main && COMPOSE_PROFILE=${VPS_COMPOSE_PROFILE:-prod} bash scripts/deploy-vps.sh deploy"

      - name: Bootstrap seed on demand
        if: github.event_name == 'workflow_dispatch' && inputs.run_seed == true
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "cd '${{ secrets.VPS_APP_DIR }}' && COMPOSE_PROFILE=${VPS_COMPOSE_PROFILE:-prod} bash scripts/deploy-vps.sh seed"
