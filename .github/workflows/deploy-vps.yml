name: Deploy to VPS

on:
  push:
    branches:
      - principal
  workflow_dispatch:
    inputs:
      run_seed:
        description: Run prisma seed after deploy
        required: false
        type: boolean
        default: false

concurrency:
  group: routlis-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_ENV_FILE: /opt/routlis/.env
      VPS_CONNECT_TIMEOUT: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Resolve SSH target
        run: |
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          if [[ -z "$port" ]]; then
            port=22
          fi
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          if [[ -z "$host" ]]; then
            echo "VPS_HOST is empty" >&2
            exit 1
          fi
          if [[ -z "${{ secrets.VPS_USER }}" ]]; then
            echo "VPS_USER is empty" >&2
            exit 1
          fi
          echo "VPS target: ${host}:${port}"
          if [[ "$host" =~ ([0-9]{1,3}\.){3}[0-9]{1,3} ]]; then
            echo "VPS target IP fallback: $(grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' <<< "$host" | head -n 1):${port}"
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Sync project files to VPS
        run: |
          try_ssh() {
            local port="$1"
            shift
            local target="$1"
            shift
            scp -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -P "$port" /tmp/routlis.tar.gz "${{ secrets.VPS_USER }}@$target:/tmp/routlis.tar.gz" &&
            ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${{ secrets.VPS_USER }}@$target" "mkdir -p '${{ secrets.VPS_APP_DIR }}' && find '${{ secrets.VPS_APP_DIR }}' -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} + && tar -xzf /tmp/routlis.tar.gz -C '${{ secrets.VPS_APP_DIR }}' && rm /tmp/routlis.tar.gz"
          }
          tar -czf /tmp/routlis.tar.gz --exclude=.git --exclude=node_modules --exclude=.next --exclude=dist .
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          port="${port:-22}"
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          fallback_ip="$(grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' <<< "$host" | head -n 1 || true)"
          if ! try_ssh "$port" "$host"; then
            if [[ -n "$fallback_ip" && "$fallback_ip" != "$host" ]]; then
              echo "Primary SSH target failed, retrying with IP fallback ${fallback_ip}:${port}"
              try_ssh "$port" "$fallback_ip"
            else
              exit 1
            fi
          fi

      - name: Ensure VPS env file exists
        run: |
          try_copy_env() {
            local port="$1"
            local target="$2"
            scp -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -P "$port" /tmp/routlis.env "${{ secrets.VPS_USER }}@$target:${{ env.VPS_ENV_FILE }}" &&
            ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${{ secrets.VPS_USER }}@$target" "chmod 600 '${{ env.VPS_ENV_FILE }}' && chown '${{ secrets.VPS_USER }}':'${{ secrets.VPS_USER }}' '${{ env.VPS_ENV_FILE }}'"
          }
          printf '%s' '${{ secrets.VPS_ENV_CONTENT_B64 }}' | base64 -d > /tmp/routlis.env
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          port="${port:-22}"
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          fallback_ip="$(grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' <<< "$host" | head -n 1 || true)"
          if ! try_copy_env "$port" "$host"; then
            if [[ -n "$fallback_ip" && "$fallback_ip" != "$host" ]]; then
              echo "Primary SSH target failed, retrying env copy with IP fallback ${fallback_ip}:${port}"
              try_copy_env "$port" "$fallback_ip"
            else
              exit 1
            fi
          fi
          rm -f /tmp/routlis.env

      - name: Preflight on VPS
        run: |
          run_remote() {
            local port="$1"
            local target="$2"
            local command="$3"
            ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${{ secrets.VPS_USER }}@$target" "$command"
          }
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          port="${port:-22}"
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          fallback_ip="$(grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' <<< "$host" | head -n 1 || true)"
          if ! run_remote "$port" "$host" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh preflight"; then
            if [[ -n "$fallback_ip" && "$fallback_ip" != "$host" ]]; then
              echo "Primary SSH target failed, retrying preflight with IP fallback ${fallback_ip}:${port}"
              run_remote "$port" "$fallback_ip" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh preflight"
            else
              exit 1
            fi
          fi

      - name: Deploy app on VPS
        run: |
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          port="${port:-22}"
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          fallback_ip="$(grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' <<< "$host" | head -n 1 || true)"
          if ! ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${{ secrets.VPS_USER }}@$host" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh deploy"; then
            if [[ -n "$fallback_ip" && "$fallback_ip" != "$host" ]]; then
              echo "Primary SSH target failed, retrying deploy with IP fallback ${fallback_ip}:${port}"
              ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${{ secrets.VPS_USER }}@$fallback_ip" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh deploy"
            else
              exit 1
            fi
          fi

      - name: Verify deploy on VPS
        run: |
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          port="${port:-22}"
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          fallback_ip="$(grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' <<< "$host" | head -n 1 || true)"
          if ! ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${{ secrets.VPS_USER }}@$host" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh verify"; then
            if [[ -n "$fallback_ip" && "$fallback_ip" != "$host" ]]; then
              echo "Primary SSH target failed, retrying verify with IP fallback ${fallback_ip}:${port}"
              ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${{ secrets.VPS_USER }}@$fallback_ip" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh verify"
            else
              exit 1
            fi
          fi

      - name: Bootstrap seed on demand
        if: github.event_name == 'workflow_dispatch' && inputs.run_seed == true
        run: |
          host='${{ secrets.VPS_HOST }}'
          host="${host#http://}"
          host="${host#https://}"
          port='${{ secrets.VPS_SSH_PORT }}'
          if [[ "$host" == *:* ]]; then
            port="${host##*:}"
            host="${host%:*}"
          fi
          fallback_ip="$(grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' <<< "$host" | head -n 1 || true)"
          if ! ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${{ secrets.VPS_USER }}@$host" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh seed"; then
            if [[ -n "$fallback_ip" && "$fallback_ip" != "$host" ]]; then
              echo "Primary SSH target failed, retrying seed with IP fallback ${fallback_ip}:${port}"
              ssh -o ConnectTimeout=${VPS_CONNECT_TIMEOUT} -o StrictHostKeyChecking=accept-new -p "$port" "${{ secrets.VPS_USER }}@$fallback_ip" "cd '${{ secrets.VPS_APP_DIR }}' && ENV_FILE='${{ env.VPS_ENV_FILE }}' bash scripts/deploy-vps.sh seed"
            else
              exit 1
            fi
          fi
