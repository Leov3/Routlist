name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_seed:
        description: Run prisma seed after deploy
        required: false
        type: boolean
        default: false

concurrency:
  group: routlis-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync project files to VPS
        run: |
          tar -czf /tmp/routlis.tar.gz --exclude=.git --exclude=node_modules --exclude=.next --exclude=dist .
          scp /tmp/routlis.tar.gz "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/routlis.tar.gz"
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "rm -rf '${{ secrets.VPS_APP_DIR }}' && mkdir -p '${{ secrets.VPS_APP_DIR }}' && tar -xzf /tmp/routlis.tar.gz -C '${{ secrets.VPS_APP_DIR }}' && rm /tmp/routlis.tar.gz"

      - name: Deploy app on VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "cd '${{ secrets.VPS_APP_DIR }}' && bash scripts/deploy-vps.sh deploy"

      - name: Bootstrap seed on demand
        if: github.event_name == 'workflow_dispatch' && inputs.run_seed == true
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "cd '${{ secrets.VPS_APP_DIR }}' && bash scripts/deploy-vps.sh seed"
