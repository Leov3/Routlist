<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Routlis AudioBoard editable mark</title>
  <desc>Editable SVG icon mark for Routlis AudioBoard.</desc>

  <defs>
    <linearGradient id="routlisPurple" x1="18" y1="64" x2="110" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B388FF"/>
      <stop offset="0.48" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="routlisPurpleSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.55 0 0 0 0 0.32 0 0 0 0 1 0 0 0 0.55 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="routlis-mark" filter="url(#softGlow)">
    <path
      id="waveform-main"
      d="M24 66 C30 66 30 50 36 50 C43 50 43 84 50 84 C57 84 57 28 64 28 C71 28 71 96 78 96 C85 96 85 42 92 42 C99 42 99 74 106 74"
      stroke="url(#routlisPurple)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle id="dot-left" cx="14" cy="66" r="4" fill="url(#routlisPurpleSoft)"/>
    <circle id="dot-right" cx="114" cy="74" r="4" fill="url(#routlisPurpleSoft)" opacity="0.9"/>
  </g>
</svg>
